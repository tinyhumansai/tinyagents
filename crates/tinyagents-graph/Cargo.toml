[package]
publish = false
name = "tinyagents-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable typed state graphs for TinyAgents."

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.1", default-features = false }
tinyagents-language = { path = "../tinyagents-language", version = "2.1.1" }
tinyagents-tracing = { path = "../tinyagents-tracing", version = "2.1.1", default-features = false }
tinyinference = { path = "../../vendor/tinyinference/crates/tinyinference", version = "0.2.1" }
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs"] }

[features]
default = []
sqlite = ["dep:rusqlite"]
tracing = ["tinyagents-harness/tracing", "tinyagents-tracing/tracing"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
