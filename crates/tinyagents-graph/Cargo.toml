[package]
publish = false
name = "tinyagents-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Durable typed state graphs for TinyAgents."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tinyagents-tasks = { path = "../tinyagents-tasks", version = "2.9.1", default-features = false }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.9.1", default-features = false, features = [
    "langfuse",
] }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.5.0" }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs"] }
tracing = { workspace = true }
# Storage ports (no database client) for `DriverCheckpointer`.
tinystoragedrivers-core = { workspace = true }
# Collision-resistant ids for `DriverCheckpointer` keys too long to store.
sha2 = "0.11"

[features]
default = []
# Retained as a no-op: SQLite persistence moved to the tinystoragedrivers
# SQLite driver, which a host passes to `DriverCheckpointer` / `DriverTaskCache`.
sqlite = []
# `DriverCheckpointer`: checkpoints, pending writes and leases on any
# tinystoragedrivers backend the host opened.
storage-drivers = []
# Tracing instrumentation is now always compiled in (via the `tracing` crate
# dependency above). This feature is retained as a no-op so downstream
# feature forwards keep compiling.
tracing = ["tinyagents-harness/tracing"]

[dev-dependencies]
tinystoragedrivers-sqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
