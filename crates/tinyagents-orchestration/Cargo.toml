[package]
publish = false
name = "tinyagents-orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host-neutral subagent invocation and lifecycle orchestration."

[dependencies]
tinyagents-definition = { path = "../tinyagents-definition", version = "3.1.1" }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = "2"
parking_lot = "0.12"
tinyagents-tasks = { path = "../tinyagents-tasks", version = "3.1.1", default-features = false }
tinyagents-harness = { path = "../tinyagents-harness", version = "3.1.1", default-features = false }
tinyagents-session = { path = "../tinyagents-session", version = "3.1.1", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.5.0" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.6.0" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing = { workspace = true }
# `blocking` bridges the synchronous `TeamLedger` / `WorkflowStore` traits onto the
# async run-ledger port.
tinyagents-storage-kit = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
# Retained as a no-op: storage drivers are always on.
storage-drivers = []
tracing = [
    "tinyagents-harness/tracing",
]

[dev-dependencies]
tinystoragedrivers-testkit = { workspace = true }
tinystoragedrivers-connect = { workspace = true }
tinystoragedrivers-document = { workspace = true }
dotenvy = "0.15"
futures = { workspace = true }
tempfile = "3"
tinyagents-definition = { path = "../tinyagents-definition", version = "3.1.1" }
tinyagents-registry = { path = "../tinyagents-registry", version = "3.1.1" }
tinyagents-runtime = { path = "../tinyagents-runtime", version = "3.1.1" }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
