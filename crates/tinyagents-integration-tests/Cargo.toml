[package]
name = "tinyagents-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
dotenvy = "0.15"
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tinyagents-harness = { path = "../tinyagents-harness" }
tinyagents-harness-tools = { path = "../tinyagents-harness-tools" }
tinyagents-orchestration = { path = "../tinyagents-orchestration" }
tinyagents-definition = { path = "../tinyagents-definition" }
tinyagents-registry = { path = "../tinyagents-registry" }
tinyagents-session = { path = "../tinyagents-session" }
tinyagents-tasks = { path = "../tinyagents-tasks" }
tinystoragedrivers-core = { workspace = true }
tinystoragedrivers-sqlite = { workspace = true }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1" }
tinyinference-embeddings = { path = "../../vendor/tinyinference/crates/tinyinference-embeddings", version = "0.4.1" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.6.0" }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[features]
default = []
# Retained as a no-op: SQLite persistence is the tinystoragedrivers SQLite driver.
sqlite = []
tools = ["tinyagents-harness-tools/todos", "tinyagents-harness-tools/goals", "tinyagents-harness-tools/skills"]
subagents = ["tinyagents-harness-tools/subagents"]
multimodal = ["tinyagents-harness/multimodal"]
claude-code = ["tinyagents-harness/claude-code"]
langfuse = ["tinyagents-harness/langfuse"]
tracing = [
    "tinyagents-harness/tracing",
    "tinyagents-registry/tracing",
    "tinyagents-session/tracing",
]

[lints.rust]
unused_imports = "allow"

[[test]]
name = "subagent_sessions_tools"
path = "tests/subagent_sessions_tools.rs"
required-features = ["subagents"]
