[package]
publish = false
name = "tinyagents-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Provider-neutral model, tool, middleware, and agent-loop runtime."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
# Keep this aligned with reqwest's transitive version. Claude Code request
# rendering and multimodal data URIs both require it.
base64 = "0.22"
chrono = { workspace = true }
dirs = { version = "6", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"], optional = true }
flate2 = { version = "1", optional = true }
oxipng = { version = "9", default-features = false, optional = true }
futures = { workspace = true }
libc = "0.2"
regex = "1"
reqwest = { workspace = true, features = ["stream", "http2"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "1.2", optional = true }
sha2 = "0.11"
thiserror = "2"
tracing = { workspace = true }
tinyagents-definition = { path = "../tinyagents-definition", version = "2.2.0" }
tinytools-agent = { path = "../../vendor/tinytools/crates/tinytools-agent", version = "0.6.0", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1" }
tinyinference-core = { path = "../../vendor/tinyinference/crates/tinyinference-core", version = "0.4.1" }
tinyinference-embeddings = { path = "../../vendor/tinyinference/crates/tinyinference-embeddings", version = "0.4.1" }
tinyinference-image = { path = "../../vendor/tinyinference/crates/tinyinference-image", version = "0.4.1", optional = true }
tinyinference-video = { path = "../../vendor/tinyinference/crates/tinyinference-video", version = "0.4.1", optional = true }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.6.0" }
# Shared URL admission for opt-in remote multimodal attachments.
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs", "io-util", "process"] }
# Storage ports (no database client): the `storage-drivers` adapters put
# the harness `Store` / `AppendStore` on any tinystoragedrivers backend.
tinystoragedrivers-core = { workspace = true }
tempfile = { workspace = true }
wait-timeout = { version = "0.2", optional = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(not(unix))'.dependencies]
cap-std.workspace = true

[dev-dependencies.cap-std]
workspace = true

[features]
default = ["claude-code", "langfuse"]
# Optional schema support for hosts that expose the harness context config.
json-schema = ["dep:schemars"]
sqlite = []
# `store::DriverStore` / `store::DriverAppendStore` over tinystoragedrivers
# ports, so a host's chosen backend (SQLite, MongoDB, memory) holds harness
# data.
storage-drivers = []
multimodal = ["dep:flate2", "dep:reqwest", "dep:tar", "dep:zip"]
# Lossless PNG re-compression (`multimodal::optimize_png_lossless`) through
# `oxipng`. Off by default: without it the helper returns `None` and callers
# keep the original bytes, and `oxipng`/`libdeflater` (a C build) are not linked.
png-optimize = ["multimodal", "dep:oxipng"]
# Image and video generation tools over tinyinference-image / -video.
media = ["dep:tinyinference-image", "dep:tinyinference-video"]
# Gates the Claude Code CLI and Claude Agent SDK provider adapters, which are
# the only consumers of `tempfile` beyond the artifact tests, `dirs`,
# and `wait-timeout` in this crate.
claude-code = ["dep:wait-timeout", "dep:dirs"]
# Gates the Langfuse observability exporter and its `reqwest` transport.
langfuse = ["dep:reqwest"]
# Tracing instrumentation is now always compiled in (via the `tracing` crate
# dependency above). This feature is retained as a no-op so downstream
# feature forwards keep compiling.
tracing = ["tinytools-agent/tracing"]

[dev-dependencies]
png = "0.17"
toml = "0.8"
tinystoragedrivers-sqlite = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
