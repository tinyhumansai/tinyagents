[package]
publish = false
name = "tinyagents-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Provider-neutral model, tool, middleware, and agent-loop runtime."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
# Keep this aligned with reqwest's transitive version. Claude Code request
# rendering and multimodal data URIs both require it.
base64 = "0.22"
chrono = { workspace = true }
chrono-tz = { version = "0.10", optional = true }
dirs = { version = "6", optional = true }
flate2 = { version = "1", optional = true }
futures = { workspace = true }
regex = "1"
reqwest = { workspace = true, features = ["stream", "http2"], optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = "2"
tracing = { workspace = true }
tinyagents-definition = { path = "../tinyagents-definition", version = "2.1.2" }
tinytools-agent = { path = "../../vendor/tinytools/crates/tinytools-agent", version = "0.4.1", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }
tinyinference-embeddings = { path = "../../vendor/tinyinference/crates/tinyinference-embeddings", version = "0.3.0" }
tinyinference-image = { path = "../../vendor/tinyinference/crates/tinyinference-image", version = "0.3.0", optional = true }
tinyinference-video = { path = "../../vendor/tinyinference/crates/tinyinference-video", version = "0.3.0", optional = true }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.4.1" }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs", "io-util", "process"] }
tempfile = { workspace = true }
wait-timeout = { version = "0.2", optional = true }
uuid = { workspace = true, optional = true }

[features]
default = ["claude-code", "langfuse"]
sqlite = ["dep:rusqlite"]
# `tools` is a deprecated alias kept so downstream feature forwards that
# still spell out the old name keep compiling.
tools = ["builtin-tools"]
builtin-tools = ["dep:chrono-tz"]
multimodal = ["dep:flate2", "dep:reqwest"]
# Image and video generation tools over tinyinference-image / -video.
media = ["dep:tinyinference-image", "dep:tinyinference-video"]
# Gates the Claude Code CLI and Claude Agent SDK provider adapters, which are
# the only consumers of `uuid`, `tempfile` beyond the artifact tests, `dirs`,
# and `wait-timeout` in this crate.
claude-code = ["dep:uuid", "dep:wait-timeout", "dep:dirs"]
# Gates the Langfuse observability exporter and its `reqwest` transport.
langfuse = ["dep:reqwest"]
# Tracing instrumentation is now always compiled in (via the `tracing` crate
# dependency above). This feature is retained as a no-op so downstream
# feature forwards keep compiling.
tracing = ["tinytools-agent/tracing"]

[dev-dependencies]
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
