[package]
publish = false
name = "tinyagents-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral model, tool, middleware, and agent-loop runtime."

[dependencies]
async-trait = "0.1"
# Keep this aligned with reqwest's transitive version so consumers do not
# resolve a second base64 package solely for multimodal data URIs.
base64 = { version = "0.22", optional = true }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", optional = true }
flate2 = { version = "1", optional = true }
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tinyagents-tracing = { path = "../tinyagents-tracing", version = "2.1.1", default-features = false }
tinyinference = { path = "../../vendor/tinyinference/crates/tinyinference", version = "0.2.1" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.1.0" }
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs"] }

[features]
default = []
sqlite = ["dep:rusqlite"]
tools = ["dep:chrono-tz"]
multimodal = ["dep:base64", "dep:flate2"]
tracing = ["tinyagents-tracing/tracing"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
