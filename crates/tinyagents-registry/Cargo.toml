[package]
publish = false
name = "tinyagents-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Named capability registry and offline model catalog."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyagents-graph = { path = "../tinyagents-graph", version = "2.1.2" }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.2", default-features = false }
tinyagents-language = { path = "../tinyagents-language", version = "2.1.2" }
tinyinference = { path = "../../vendor/tinyinference/crates/tinyinference", version = "0.2.1" }

[features]
default = []
tracing = ["tinyagents-graph/tracing", "tinyagents-harness/tracing"]

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
