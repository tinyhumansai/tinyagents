[package]
publish = false
name = "tinyagents-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Named capability registry and offline model catalog."

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tinyagents-definition = { path = "../tinyagents-definition", version = "2.1.2" }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.2", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.4.0" }

[features]
default = []
tracing = ["tinyagents-harness/tracing"]

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
