[package]
publish = false
name = "tinyagents-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Durable TinyAgents session history and run ledger."

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = "2"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "1", features = ["derive", "chrono04"] }
tinyagents-harness = { path = "../tinyagents-harness", version = "3.1.2", default-features = false, features = ["sqlite"] }
# `OrchestrationTaskStatus` is the canonical lifecycle status the run-ledger and
# transcript-view statuses convert to and from.
tinyagents-tasks = { path = "../tinyagents-tasks", version = "3.1.2", default-features = false }
tinytools-agent = { path = "../../vendor/tinytools/crates/tinytools-agent", version = "0.6.0", default-features = false }
hex = "0.4"
sha2 = "0.11"
parking_lot = "0.12"
tracing = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["sync"] }
# `threads` names its atomic-rewrite temp files `.conversations-<uuid>.tmp`.
uuid = { workspace = true }
# Port contracts and their shared type models. Engine implementations are
# supplied by the host; session code never opens a storage engine.
tinystoragedrivers-api = { workspace = true }
tinystoragedrivers-types = { workspace = true }
tinyagents-storage-kit = { workspace = true }

[features]
default = []
testkit = []
# Tracing instrumentation is now always compiled in (via the `tracing` crate
# dependency above). This feature is retained as a no-op so downstream
# feature forwards keep compiling.
tracing = ["tinyagents-harness/tracing"]
# A `SessionStoreProvider` over `tinystoragedrivers` ports, so a host can keep
# every agent's transcripts, turn states, records and journal in whichever
# backend it opened (SQLite, MongoDB, memory, ...).
# Retained as a no-op: storage drivers are always on.
storage-drivers = []

[dev-dependencies]
tinystoragedrivers-connect = { workspace = true }
tinystoragedrivers-document = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "29471a164619bcec03e5858a7d7ee0c65f52bf22" }
tinystoragedrivers-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
