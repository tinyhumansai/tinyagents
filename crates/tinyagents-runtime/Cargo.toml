[package]
publish = false
name = "tinyagents-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host-neutral stateful sessions over TinyAgents harness and transcript storage."

[dependencies]
async-trait = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = "2"
tinyagents-harness = { path = "../tinyagents-harness", version = "2.2.0" }
tinyagents-hooks = { path = "../tinyagents-hooks", version = "2.2.0" }
tinyagents-registry = { path = "../tinyagents-registry", version = "2.2.0" }
tinyagents-session = { path = "../tinyagents-session", version = "2.2.0" }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.6.0" }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tinystoragedrivers-core = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
