[package]
publish = false
name = "tinyagents-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-neutral stateful sessions over TinyAgents harness and transcript storage."

[dependencies]
async-trait = "0.1"
chrono = "0.4"
thiserror = "2"
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.2" }
tinyagents-session = { path = "../tinyagents-session", version = "2.1.2" }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.3.0" }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
anyhow = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
