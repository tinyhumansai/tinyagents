[package]
publish = false
name = "tinyagents-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Graph-independent detached-task registry, task stores and orchestration controls for TinyAgents."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.2.0", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1" }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true }
# Storage ports (no database client). `blocking` bridges the synchronous
# `TaskStore` / `CompletionStore` traits onto the async ports.
tinystoragedrivers-core = { workspace = true, features = ["blocking"] }

[dev-dependencies]
async-trait = { workspace = true }
tinystoragedrivers-sqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
