[package]
publish = false
name = "tinyagents-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Graph-independent detached-task registry, task stores and orchestration controls for TinyAgents."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tinyagents-harness = { path = "../tinyagents-harness", version = "3.1.3", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.5.0" }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true }
# Storage ports (no database client). `blocking` bridges the synchronous
# `TaskStore` / `CompletionStore` traits onto the async ports.
tinyagents-storage-kit = { workspace = true }

[dev-dependencies]
tinystoragedrivers-connect = { workspace = true }
tinystoragedrivers-testkit = { workspace = true }
tinystoragedrivers-document = { version = "2.1.2", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "6226b9484c8bd01c58741718cd89ba90a13a36bb" }
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
