name: Release

# A release is a `vX.Y.Z` tag on a commit already on main. The version bump
# lands on main through a reviewed pull request first; this workflow never
# commits, tags, or pushes. Dispatch with an existing tag to retry a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) on a commit on main
        type: string
        required: true

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-rust:
    name: Release Rust Crate
    runs-on: ubuntu-latest
    environment: Production
    env:
      # The crate previously named `tinyagents` was split into per-concern
      # crates in `crates/*` (see commit 612ea5e). Version is now inherited
      # from `[workspace.package].version` in the root Cargo.toml rather
      # than set literally in a crate's own `[package]` table, so we track
      # it via `tinyagents-harness`, which is always present and shares the
      # workspace-inherited version.
      CRATE_NAME: tinyagents-harness
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
          # Required to resolve the `vendor/tinytools` path dependency.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Verify the release tag is on main and matches the crate version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release must be dispatched from main" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '${RELEASE_TAG}' is not vX.Y.Z" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "Checked-out commit is not ${RELEASE_TAG}" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "${RELEASE_TAG} (${tag_commit}) is not on main; merge the version bump through a pull request and tag the merged commit" >&2
            exit 1
          fi

          crate_version="$(cargo metadata --format-version 1 --no-deps | jq -r --arg crate "$CRATE_NAME" '.packages[] | select(.name == $crate) | .version')"
          if [[ "v${crate_version}" != "$RELEASE_TAG" ]]; then
            echo "${RELEASE_TAG} does not match ${CRATE_NAME} version ${crate_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # TODO: drop `continue-on-error` once the existing ~160 broken
      # intra-doc link warnings across the workspace are fixed and this can
      # block merges instead of only reporting.
      - name: Doc lints
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps
        continue-on-error: true

      # TODO: drop `continue-on-error` once the existing unused-dependency
      # findings across the workspace are cleaned up and this can block
      # merges instead of only reporting.
      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@main
        continue-on-error: true

      - name: Check crates.io publishability
        id: publishable
        run: |
          set -euo pipefail

          publish="$(cargo metadata --no-deps --format-version 1 | jq -r --arg crate "$CRATE_NAME" '.packages[] | select(.name == $crate) | .publish')"
          if [[ "$publish" == "[]" ]]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${CRATE_NAME} has publish = false; skipping crates.io package/publish steps."
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package crate
        if: steps.publishable.outputs.publishable == 'true'
        run: cargo package --locked -p "$CRATE_NAME"

      - name: Publish to crates.io
        if: steps.publishable.outputs.publishable == 'true'
        run: cargo publish --locked -p "$CRATE_NAME"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
