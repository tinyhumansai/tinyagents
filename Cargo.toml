[workspace]
members = ["crates/*"]
default-members = [
    "crates/tinyagents-harness",
    "crates/tinyagents-language",
    "crates/tinyagents-graph",
    "crates/tinyagents-registry",
    "crates/tinyagents-session",
    "crates/tinyagents-orchestration",
]
exclude = ["vendor", "worktrees"]
resolver = "3"

[workspace.package]
version = "2.1.2"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyagents"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
