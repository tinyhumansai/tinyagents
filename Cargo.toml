[workspace]
members = ["crates/*"]
default-members = [
    "crates/tinyagents-harness",
    "crates/tinyagents-harness-tools",
    "crates/tinyagents-tasks",
    "crates/tinyagents-registry",
    "crates/tinyagents-session",
    "crates/tinyagents-runtime",
    "crates/tinyagents-hooks",
    "crates/tinyagents-orchestration",
    "crates/tinyagents-live",
]
exclude = ["vendor", "worktrees", "integration-proofs/run-ledger-mongodb"]
resolver = "3"

[workspace.package]
version = "3.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyagents"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
cap-std = "4"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
rustix = { version = "1.1", features = ["fs"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
# Storage ports use one canonical TinyStorageDrivers revision across TinyAgents
# and TinyInference, so a host's graph holds one set of port types without a
# [patch] to reconcile them.
tinystoragedrivers-types = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-api = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-testkit = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456", default-features = false, features = ["sqlite"] }
tinystoragedrivers-document = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456", features = ["sqlite", "file"] }
tinystoragedrivers-connect = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456", features = ["sqlite"] }
tinyagents-storage-kit = { path = "crates/tinyagents-storage-kit" }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# `tinyinference-llm` names `tinytools-agent` as a git dependency (it is not on
# crates.io). Inside this workspace that crate is the vendored submodule, so the
# git source is redirected onto the path — one copy of the protocol crate in the
# graph, and the harness's `path` dependency and the provider's dependency are
# the same type.
[patch."https://github.com/tinyhumansai/tinytools"]
tinytools-agent = { path = "vendor/tinytools/crates/tinytools-agent" }
tinytools = { path = "vendor/tinytools/crates/tinytools" }

