[workspace]
members = ["crates/*"]
default-members = [
    "crates/tinyagents-harness",
    "crates/tinyagents-language",
    "crates/tinyagents-graph",
    "crates/tinyagents-registry",
    "crates/tinyagents-session",
]
exclude = ["vendor", "worktrees"]
resolver = "3"

[workspace.package]
version = "2.1.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyagents"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
