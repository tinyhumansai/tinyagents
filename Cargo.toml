[workspace]
members = ["crates/*"]
default-members = [
    "crates/tinyagents-harness",
    "crates/tinyagents-graph",
    "crates/tinyagents-tasks",
    "crates/tinyagents-registry",
    "crates/tinyagents-session",
    "crates/tinyagents-runtime",
    "crates/tinyagents-orchestration",
    "crates/tinyagents-live",
]
exclude = ["vendor", "worktrees"]
resolver = "3"

[workspace.package]
version = "2.1.4"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyagents"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
# Storage ports from the vendored tinystoragedrivers submodule. Hosts that
# vendor tinyagents use this same copy, so there is one set of port types.
tinystoragedrivers-core = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-core", version = "0.4.0" }
tinystoragedrivers-sqlite = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-sqlite", version = "0.4.0" }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# `tinyinference-llm` names `tinytools-agent` as a git dependency (it is not on
# crates.io). Inside this workspace that crate is the vendored submodule, so the
# git source is redirected onto the path — one copy of the protocol crate in the
# graph, and the harness's `path` dependency and the provider's dependency are
# the same type.
[patch."https://github.com/tinyhumansai/tinytools"]
tinytools-agent = { path = "vendor/tinytools/crates/tinytools-agent" }
tinytools = { path = "vendor/tinytools/crates/tinytools" }

